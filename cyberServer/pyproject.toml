[build-system]
# setuptools installs the app package so Python can import it from the project.
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "cyberplanner-python"
version = "0.1.0"
description = "Python backend for CyberPlanner"
requires-python = ">=3.12"
# Runtime packages: web API, PostgreSQL, .env loading, and the ASGI web server.
dependencies = [
    "fastapi>=0.115,<1",
    "psycopg[binary]>=3.2,<4",
    "python-dotenv>=1.0,<2",
    "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
# Optional tools for development; install with cyberServer[dev].
dev = [
    "httpx>=0.27,<1",
    "pytest>=8.3,<9",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
